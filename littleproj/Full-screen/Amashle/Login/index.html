<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <nav>
        <div class="brand-container">
          <div class="black-container">
            <img src="/littleproj/html, css, js test files/test files/Testfile_elpueblo/Images/elpueblo-removebg-preview1.png" alt="logo"/>
          </div>
        </div>
        <div class="auth-buttons">
          <a href="/littleproj/html, css, js test files/test files/Testfile_elpueblo/Sign-in-as/index.html" class="back-btn"><img src="/littleproj/html, css, js test files/test files/Testfile_elpueblo/Images/left-arrow-1.png" alt="left-arrow"> Go back</a>
        </div>
      </nav>
    <main>
        <section class="form-container">

            <h2>Login</h2>

            <form action="#" method="post">

                <div class="input-container">
                    <img src="/littleproj/Full-screen/Amashle/Images/username-black-64.png" alt="user" class="icon">
                    <input type="text" name="username" placeholder="Username" required>
                </div>

                <div class="input-container">
                    <img src="/littleproj/Full-screen/Amashle/Images/email-24.png" alt="email" class="icon">
                    <input type="email" name="email" placeholder="Email" required>
                </div>

                <div class="remember-me-container">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="login-btn">Login</button>

                <a href="#" class="forgot-pass">Forgot Password?</a>

                <p id="login-with">Or login with</p>

                <div class="login-with-btn-container">
                    <a href="#" class="login-with-btn">
                        <img src="/littleproj/Full-screen/Amashle/Images/fbwhite.png" alt="facebook-icon" class="socmed-icons">
                        <span id="facebook-span">Facebook</span>
                    </a>

                    <a href="#" class="login-with-btn">
                        <img src="/littleproj/Full-screen/Amashle/Images/appleblack.png" alt="apple-icon" class="socmed-icons">
                        <span class="apple-span">Apple</span>
                    </a>

                    <a href="#" class="login-with-btn">
                        <img src="/littleproj/Full-screen/Amashle/Images/google-48.png" alt="google-icon" class="socmed-icons">
                        <span class="apple-span">Google</span>
                    </a>

                    <a href="#" class="login-with-btn">
                        <img src="/littleproj/Full-screen/Amashle/Images/github-30.png" alt="github-icon" class="socmed-icons">
                        <span class="apple-span">Github</span>
                    </a>
                </div>

                <div class="register-container">
                    Not registered yet?
                    <a href="/littleproj/Full-screen/Amashle/Register/index.html" class="register-link">Register now</a>
                </div>
            </form>
        </section>
        <div class="back">
            <a href="/littleproj/Full-screen/Amashle/Main-interface/index.html" class="back-to-homepage">← Go back to homepage</a>
        </div>
    </main>
</body>
</html>
