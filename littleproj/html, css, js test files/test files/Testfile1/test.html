<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="test.css" />
</head>

<body>
  <div class="main-container">
    <h1>Nike Originals</h1>

    <div class="wrapper">
      <div class="grid">

        <div class="card"
             onclick="openModal('productModal1')"
             onmouseover="hoverImage('unhoveredImage1','hoveredImage1')"
             onmouseout="unhoverImage('unhoveredImage1','hoveredImage1')">

          <div class="image-container">
            <img id="unhoveredImage1" class="image" src="AIR_JORDAN_4_RM1.png" />
            <img id="hoveredImage1" class="hidden-image" src="W_AIR_MAX_DN_PRM.png" />
          </div>

          <div class="shoe-name">Air Jordan 4 RM</div>
          <div class="price">₱10,000</div>
          <div class="real-price">₱15,000</div>
          <div class="discount">30% off</div>
        </div>

        <div class="card"
             onclick="openModal('productModal2')"
             onmouseover="hoverImage('unhoveredImage2','hoveredImage2')"
             onmouseout="unhoverImage('unhoveredImage2','hoveredImage2')">

          <div class="image-container">
            <img id="unhoveredImage2" class="image" src="W_AIR_MAX_DN_PRM.png" />
            <img id="hoveredImage2" class="hidden-image" src="AIR_JORDAN_4_RM1.png" />
          </div>

          <div class="shoe-name">Air Jordan 4 RM</div>
          <div class="price">₱10,000</div>
          <div class="real-price">₱15,000</div>
          <div class="discount">30% off</div>
        </div>

      </div>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>

  <div class="modal" id="productModal1">
    <div class="image-container-modal"
         onmouseover="modalhoverImage('modal-unhoveredImage1','modal-hoveredImage1')"
         onmouseout="modalunhoverImage('modal-unhoveredImage1','modal-hoveredImage1')">

      <img id="modal-unhoveredImage1" class="image" src="AIR_JORDAN_4_RM1.png" />
      <img id="modal-hoveredImage1" class="hidden-image" src="W_AIR_MAX_DN_PRM.png" />
    </div>

    <div class="modal-content">
      <div class="modal-description">
        <div class="modal-title"><h2>Air Jordan 4 RM</h2></div>
        <div class="modal-paragraph"><p>Mao ni iyang description1</p></div>
        <div class="modal-close-button">
          <button onclick="closeModal('productModal1')" class="close-btn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="productModal2">
    <div class="image-container-modal"
         onmouseover="modalhoverImage('modal-unhoveredImage2','modal-hoveredImage2')"
         onmouseout="modalunhoverImage('modal-unhoveredImage2','modal-hoveredImage2')">

      <img id="modal-unhoveredImage2" class="image" src="W_AIR_MAX_DN_PRM.png" />
      <img id="modal-hoveredImage2" class="hidden-image" src="AIR_JORDAN_4_RM1.png" />
    </div>

    <div class="modal-content">
      <div class="modal-description">
        <div class="modal-title"><h2>Air Jordan 4 RM</h2></div>
        <div class="modal-paragraph"><p>Mao ni iyang description2</p></div>
        <div class="modal-close-button">
          <button onclick="closeModal('productModal2')" class="close-btn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="test.js"></script>
</body>
</html>
